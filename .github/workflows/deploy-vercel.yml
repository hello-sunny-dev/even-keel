name: Deploy to Vercel

# Deploying from here rather than from Vercel's Git integration keeps one rule
# intact: a deploy is something somebody asks for. A private household ledger
# does not want a preview URL minted for every push.
on:
  workflow_dispatch:
    inputs:
      production:
        description: "Deploy as production (aliases your-app.vercel.app). Off makes a preview URL."
        type: boolean
        default: false
      sync_env:
        description: "Push DATABASE_URL from the repository secrets into Vercel first, and mint SESSION_SECRET if the project has none."
        type: boolean
        default: false

# Not secrets: without the token they identify a project and nothing more.
# Given to the CLI directly because `vercel link` asks which team it should use
# and then waits for an answer that a runner has no way to give — the first
# attempt sat on that prompt until it was cancelled.
env:
  VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the token is there
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN is not set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

      # The REST API, not `vercel env add`: the CLI stops to ask which
      # environments the variable is for even when the target is already on the
      # command line, and a runner has no way to answer. Two runs died on that
      # prompt before this replaced it.
      #
      # `--data @-` reads the body from stdin, so neither the connection string
      # nor the minted secret is ever an argument — an argument is visible in
      # `ps` and in the step log. Only status codes are printed.
      - name: Sync environment variables
        if: ${{ inputs.sync_env }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          api="https://api.vercel.com"
          auth="Authorization: Bearer $VERCEL_TOKEN"

          # `upsert=true` replaces a value that is already there, so a run after
          # a database password change does the right thing without a delete.
          put() {
            code=$(KEY="$1" VALUE="$2" node -e '
              process.stdout.write(JSON.stringify({
                key: process.env.KEY,
                value: process.env.VALUE,
                type: "encrypted",
                target: ["production"],
              }));
            ' | curl -sS -o /dev/null -w "%{http_code}" -X POST \
                 "$api/v10/projects/$VERCEL_PROJECT_ID/env?teamId=$VERCEL_ORG_ID&upsert=true" \
                 -H "$auth" -H "Content-Type: application/json" --data @-)
            echo "$1 -> HTTP $code"
            case "$code" in 2*) ;; *) echo "::error::Setting $1 failed"; exit 1 ;; esac
          }

          if [ -n "${DATABASE_URL:-}" ]; then
            put DATABASE_URL "$DATABASE_URL"
          else
            echo "No DATABASE_URL secret here — leaving whatever Vercel already holds."
          fi

          # Minted once and never rotated by a deploy: changing it signs both of
          # them out, which is a thing to do on purpose rather than a side
          # effect of shipping a CSS fix.
          existing=$(curl -sS -H "$auth" \
            "$api/v9/projects/$VERCEL_PROJECT_ID/env?teamId=$VERCEL_ORG_ID" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
                const envs = JSON.parse(s).envs || [];
                process.stdout.write(envs.some(e => e.key === "SESSION_SECRET") ? "yes" : "no");
              })')
          if [ "$existing" = "yes" ]; then
            echo "SESSION_SECRET already set — left alone."
          else
            put SESSION_SECRET "$(node -e 'process.stdout.write(crypto.randomUUID()+crypto.randomUUID())')"
          fi

      # Before shipping, not after: an untraced runtime file is invisible until
      # somebody uploads a statement to the deployed app.
      - name: Runtime files are traced
        run: |
          npm ci
          npm run build
          npm run check:tracing

      - name: Deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -e
          if [ "${{ inputs.production }}" = "true" ]; then FLAG="--prod"; else FLAG=""; fi
          URL=$(npx --yes vercel@latest deploy --token="$VERCEL_TOKEN" --yes $FLAG)
          echo "### Deployed to $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL"
