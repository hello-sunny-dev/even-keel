name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      # Real statements live only on the owner's machine, so the fixtures that
      # need them skip here. Everything else must pass.
      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      # A local build resolves anything in node_modules whether it was traced
      # or not, so this is the only check that sees what the deployment will
      # actually contain.
      - name: Runtime files are traced
        run: npm run check:tracing

      # The suite builds and starts the app itself, against a disposable
      # PGlite database. It is the only place the production build, the CSP
      # and the security headers are exercised the way they actually ship.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end
        run: npm run e2e

      - name: Keep the traces from a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
